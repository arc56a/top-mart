<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176d4d">
  <link rel="manifest" href="manifest.json">
  <title>رفّ | نظام المخزون والكاشير</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f6f4;
      --ink: #111e17;
      --muted: #627268;
      --line: #d2dbd3;
      --green: #176d4d;
      --green-dark: #105238;
      --lime: #d8ee9c;
      --white: #fff;
      --danger: #bd4936;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Tahoma, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100%, 560px); min-height: 100vh; margin: auto; padding: 12px 16px 96px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--green); color: var(--lime); font-size: 20px; font-weight: 800; }
    .brand-name { font-size: 19px; font-weight: 800; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .sound-btn { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 11px; font-weight: 700; color: var(--ink); }
    .sound-btn.muted { color: var(--muted); background: #eaeaea; }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn .2s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .section-title { font-size: 16px; font-weight: 800; margin: 0 0 12px; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
    .section-title span { color: var(--muted); font-size: 12px; font-weight: normal; }

    .scanner-box { position: relative; width: 100%; aspect-ratio: 1.3; background: #0f1a14; border-radius: 16px; overflow: hidden; display: grid; place-items: center; color: white; margin-bottom: 12px; }
    .scanner-box video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    .scan-placeholder { position: relative; z-index: 1; text-align: center; padding: 20px; }
    .scan-placeholder div { font-size: 32px; margin-bottom: 8px; }
    .scan-placeholder span { font-size: 12px; color: #b5c4bc; }
    .scan-guide { position: absolute; z-index: 2; display: none; width: 75%; height: 32%; border: 2px solid var(--lime); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.3); }
    .scanner-box.scanning .scan-guide { display: block; }
    .scanner-box.scanning .scan-placeholder { display: none; }

    .button { min-height: 46px; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 800; font-size: 14px; width: 100%; }
    .btn-primary { background: var(--green); color: white; }
    .btn-primary:active { background: var(--green-dark); }
    .btn-secondary { background: white; border: 1px solid var(--line); color: var(--ink); }

    .form-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 700; }
    .two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; outline: none; padding: 0 12px; background: white; color: var(--ink); font-size: 14px; }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23,109,77,.1); }
    input[type=number] { direction: ltr; text-align: right; }

    .notice { min-height: 20px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--green); text-align: center; }

    .product-result { display: none; background: white; border: 2px solid var(--green); border-radius: 16px; padding: 16px; margin-top: 12px; }
    .product-result.visible { display: block; animation: fadeIn .2s ease both; }
    .result-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .result-barcode { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; margin-bottom: 12px; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-box { background: var(--paper); padding: 10px; border-radius: 10px; }
    .result-box span { font-size: 11px; color: var(--muted); display: block; }
    .result-box strong { font-size: 20px; display: block; margin-top: 2px; }

    .error-box { display: none; background: #fdf2f0; color: #8a3222; padding: 14px; border-radius: 12px; font-size: 13px; margin-top: 12px; text-align: center; font-weight: 700; }
    .error-box.visible { display: block; }

    .inventory-list { display: grid; gap: 8px; margin-top: 10px; }
    .inventory-row { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .item-info strong { font-size: 14px; display: block; }
    .item-info span { font-size: 11px; color: var(--muted); direction: ltr; display: block; margin-top: 2px; text-align: right; }
    .item-qty { text-align: left; }
    .item-qty strong { font-size: 14px; display: block; }
    .item-qty span { font-size: 10px; color: var(--muted); display: block; }
    .delete-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: #fde8e6; color: var(--danger); font-size: 16px; display: grid; place-items: center; }

    .bottom-nav { position: fixed; z-index: 5; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(2, 1fr); width: min(100%, 560px); margin: auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(244,246,244,.95); backdrop-filter: blur(10px); }
    .nav-btn { display: grid; justify-items: center; gap: 3px; min-height: 48px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
    .nav-btn.active { background: #e5eee8; color: var(--green); }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">رف</div>
        <div class="brand-name">نظام المخزون</div>
      </div>
      <div class="header-actions">
        <button class="sound-btn" id="sound-toggle" type="button">🔊 صوت الكاشير</button>
      </div>
    </header>

    <!-- ================= 1. قسم إضافة مادة ================= -->
    <section class="panel active" id="add-panel">
      <div class="section-title">إضافة مادة جديدة <span>عبر الكاميرا</span></div>

      <div class="form-card">
        <div class="scanner-box" id="add-scanner-box">
          <video id="add-video" playsinline muted></video>
          <div class="scan-placeholder">
            <div>📷</div>
            <span>اضغط تشغيل الكاميرا لقراءة الباركود</span>
          </div>
          <div class="scan-guide"></div>
        </div>
        <button class="button btn-secondary" id="add-camera-btn" type="button" style="margin-bottom: 12px;">تشغيل كاميرا المسح</button>

        <form id="product-form">
          <div class="field">
            <label>رقم الباركود</label>
            <input id="barcode-input" type="text" inputmode="numeric" autocomplete="off" placeholder="يتم قراءته تلقائياً أو كتابته" aria-label="رقم الباركود" required>
          </div>
          <div class="field">
            <label>اسم المادة</label>
            <input id="name-input" type="text" autocomplete="off" placeholder="مثال: سكر كيس 2 كيلو" aria-label="اسم المادة" required>
          </div>
          <div class="two-fields">
            <div class="field">
              <label>عدد المخزن</label>
              <input id="stock-input" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="عدد المخزن" required>
            </div>
            <div class="field">
              <label>عدد العرض</label>
              <input id="display-input" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="عدد العرض" required>
            </div>
          </div>
          <button class="button btn-primary" type="submit">حفظ المادة في المخزون</button>
          <div class="notice" id="form-notice"></div>
        </form>
      </div>
    </section>

    <!-- ================= 2. قسم الكشف والبحث عن منتج ================= -->
    <section class="panel" id="search-panel">
      <div class="section-title">كشف وبحث عن منتج <span>كاشير وجرد</span></div>

      <div class="form-card">
        <div class="scanner-box" id="search-scanner-box">
          <video id="search-video" playsinline muted></video>
          <div class="scan-placeholder">
            <div>🔍</div>
            <span>اضغط تشغيل كاميرا الكاشير للكشف الفوري</span>
          </div>
          <div class="scan-guide"></div>
        </div>
        <button class="button btn-secondary" id="search-camera-btn" type="button" style="margin-bottom: 12px;">تشغيل كاميرا الكاشير</button>

        <form id="lookup-form" style="display: flex; gap: 8px;">
          <input id="lookup-barcode" type="text" inputmode="numeric" autocomplete="off" placeholder="أو أدخل الباركود يدويًا" aria-label="بحث بالباركود">
          <button class="button btn-secondary" type="submit" style="width: 90px;">بحث</button>
        </form>

        <article class="product-result" id="product-result">
          <div class="result-name" id="res-name"></div>
          <div class="result-barcode" id="res-barcode"></div>
          <div class="result-grid">
            <div class="result-box">
              <span>المخزن</span>
              <strong id="res-stock">0</strong>
            </div>
            <div class="result-box">
              <span>العرض</span>
              <strong id="res-display">0</strong>
            </div>
          </div>
        </article>

        <div class="error-box" id="error-result">
          هذا الباركود غير مسجل في النظام. انتقل لقسم "إضافة مادة" لتسجيله.
        </div>
      </div>

      <!-- قائمة سريعة للمواد المسجلة -->
      <div class="section-title" style="margin-top: 16px;">المواد المسجلة <span id="inventory-count">0</span></div>
      <div style="margin-bottom: 10px;">
        <input id="inventory-search" type="search" placeholder="بحث سريع بالاسم أو الباركود" aria-label="بحث سريع في المخزون">
      </div>
      <div class="inventory-list" id="inventory-list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-panel="add-panel" type="button">➕ إضافة مادة</button>
    <button class="nav-btn" data-panel="search-panel" type="button">🔍 كشف وبحث</button>
  </nav>

  <script>
    (() => {
      const STORAGE_KEY = "raff-inventory-v2";
      const SOUND_KEY = "raff-sound-v2";
      const numberFormat = new Intl.NumberFormat("ar");
      const byId = (id) => document.getElementById(id);

      let products = loadProducts();
      let soundEnabled = localStorage.getItem(SOUND_KEY) !== "false";

      // متغيرات الكاميرا لإضافة مادة
      let addStream = null;
      let addDetector = null;
      let addFrameId = 0;
      let addDetecting = false;

      // متغيرات الكاميرا للكشف/البحث
      let searchStream = null;
      let searchDetector = null;
      let searchFrameId = 0;
      let searchDetecting = false;
      let lastSearchedBarcode = "";
      let lastSearchedAt = 0;

      updateSoundUI();

      // --- نظام الصوت (صوت الكاشير / الباركود) ---
      function playCashSound() {
        if (!soundEnabled) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();

          // Beep
          const o1 = ctx.createOscillator();
          const g1 = ctx.createGain();
          o1.type = 'sine';
          o1.frequency.setValueAtTime(1300, ctx.currentTime);
          g1.gain.setValueAtTime(0.12, ctx.currentTime);
          g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
          o1.connect(g1);
          g1.connect(ctx.destination);
          o1.start();
          o1.stop(ctx.currentTime + 0.07);

          // Cha-Ching
          setTimeout(() => {
            if (ctx.state === 'closed') return;
            const o2 = ctx.createOscillator();
            const g2 = ctx.createGain();
            o2.type = 'triangle';
            o2.frequency.setValueAtTime(1046.50, ctx.currentTime); // C6
            o2.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08); // E6
            g2.gain.setValueAtTime(0.18, ctx.currentTime);
            g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            o2.connect(g2);
            g2.connect(ctx.destination);
            o2.start();
            o2.stop(ctx.currentTime + 0.25);
          }, 90);
        } catch (e) {
          console.warn(e);
        }
      }

      function updateSoundUI() {
        byId("sound-toggle").textContent = soundEnabled ? "🔊 صوت الكاشير: مفعل" : "🔇 صوت الكاشير: متوقف";
        byId("sound-toggle").classList.toggle("muted", !soundEnabled);
      }

      byId("sound-toggle").addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem(SOUND_KEY, soundEnabled);
        updateSoundUI();
        if (soundEnabled) playCashSound();
      });

      // --- التخزين ---
      function loadProducts() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved) ? saved.filter(item => item && item.barcode) : [];
        } catch { return []; }
      }

      function saveProducts() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
          return true;
        } catch {
          byId("form-notice").textContent = "خطأ: الذاكرة ممتلئة.";
          return false;
        }
      }

      // --- التنقل بين الشاشات ---
      function showPanel(panelId) {
        document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === panelId));
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.panel === panelId));

        if (panelId !== "add-panel") stopAddCamera();
        if (panelId !== "search-panel") stopSearchCamera();

        if (panelId === "add-panel") byId("barcode-input").focus({ preventScroll: true });
      }

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => showPanel(btn.dataset.panel));
      });

      // --- 1. قسم إضافة مادة (الكاميرا تسجل الباركود تلقائياً) ---
      async function startAddCamera() {
        if (!("BarcodeDetector" in window) || !navigator.mediaDevices?.getUserMedia) {
          alert("الكاميرا أو قارئ الباركود غير مدعوم في هذا المتصفح.");
          return;
        }
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          addDetector = new BarcodeDetector({ formats: supported });
          addStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
          const video = byId("add-video");
          video.srcObject = addStream;
          await video.play();
          byId("add-scanner-box").classList.add("scanning");
          byId("add-camera-btn").textContent = "إيقاف الكاميرا";
          scanAddLoop();
        } catch (e) {
          stopAddCamera();
          alert("تعذر تشغيل الكاميرا.");
        }
      }

      async function scanAddLoop() {
        if (!addStream || !addDetector) return;
        const video = byId("add-video");
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && !addDetecting) {
          addDetecting = true;
          try {
            const codes = await addDetector.detect(video);
            if (codes.length > 0) {
              const code = codes[0].rawValue;
              byId("barcode-input").value = code;
              playCashSound();
              stopAddCamera();
              byId("name-input").focus();
            }
          } catch {}
          addDetecting = false;
        }
        addFrameId = requestAnimationFrame(scanAddLoop);
      }

      function stopAddCamera() {
        cancelAnimationFrame(addFrameId);
        if (addStream) addStream.getTracks().forEach(t => t.stop());
        addStream = null;
        byId("add-video").srcObject = null;
        byId("add-scanner-box").classList.remove("scanning");
        byId("add-camera-btn").textContent = "تشغيل كاميرا المسح";
      }

      byId("add-camera-btn").addEventListener("click", () => {
        if (addStream) stopAddCamera();
        else startAddCamera();
      });

      byId("product-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const barcode = byId("barcode-input").value.trim();
        const name = byId("name-input").value.trim();
        const stock = Number(byId("stock-input").value);
        const display = Number(byId("display-input").value);

        if (!barcode || !name) return;

        const idx = products.findIndex(p => p.barcode === barcode);
        const item = { barcode, name, stock, display };

        if (idx >= 0) products[idx] = item;
        else products.unshift(item);

        if (!saveProducts()) return;

        byId("form-notice").textContent = "✓ تم حفظ المادة بنجاح";
        setTimeout(() => { byId("form-notice").textContent = ""; }, 2500);

        byId("barcode-input").value = "";
        byId("name-input").value = "";
        byId("stock-input").value = "0";
        byId("display-input").value = "0";
        renderInventory();
      });

      // --- 2. قسم الكشف والبحث (كاشير - يعرض الاسم والعدد فوراً مع صوت) ---
      function lookupProduct(barcode) {
        const val = barcode.trim();
        if (!val) return;
        byId("lookup-barcode").value = val;

        const product = products.find(p => p.barcode === val);
        const resBox = byId("product-result");
        const errBox = byId("error-result");

        if (!product) {
          resBox.classList.remove("visible");
          errBox.classList.add("visible");
          return;
        }

        // قراءة صحيحة لمنتج مضاف مسبقاً -> تشغيل صوت الكاشير
        playCashSound();

        errBox.classList.remove("visible");
        byId("res-name").textContent = product.name;
        byId("res-barcode").textContent = product.barcode;
        byId("res-stock").textContent = numberFormat.format(product.stock || 0);
        byId("res-display").textContent = numberFormat.format(product.display || 0);
        resBox.classList.add("visible");
      }

      async function startSearchCamera() {
        if (!("BarcodeDetector" in window) || !navigator.mediaDevices?.getUserMedia) {
          alert("الكاميرا غير مدعومة.");
          return;
        }
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          searchDetector = new BarcodeDetector({ formats: supported });
          searchStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
          const video = byId("search-video");
          video.srcObject = searchStream;
          await video.play();
          byId("search-scanner-box").classList.add("scanning");
          byId("search-camera-btn").textContent = "إيقاف الكاميرا";
          scanSearchLoop();
        } catch (e) {
          stopSearchCamera();
          alert("تعذر تشغيل الكاميرا.");
        }
      }

      async function scanSearchLoop() {
        if (!searchStream || !searchDetector) return;
        const video = byId("search-video");
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && !searchDetecting) {
          searchDetecting = true;
          try {
            const codes = await searchDetector.detect(video);
            if (codes.length > 0) {
              const code = codes[0].rawValue;
              const now = Date.now();
              if (code !== lastSearchedBarcode || now - lastSearchedAt > 1500) {
                lastSearchedBarcode = code;
                lastSearchedAt = now;
                lookupProduct(code);
              }
            }
          } catch {}
          searchDetecting = false;
        }
        searchFrameId = requestAnimationFrame(scanSearchLoop);
      }

      function stopSearchCamera() {
        cancelAnimationFrame(searchFrameId);
        if (searchStream) searchStream.getTracks().forEach(t => t.stop());
        searchStream = null;
        byId("search-video").srcObject = null;
        byId("search-scanner-box").classList.remove("scanning");
        byId("search-camera-btn").textContent = "تشغيل كاميرا الكاشير";
      }

      byId("search-camera-btn").addEventListener("click", () => {
        if (searchStream) stopSearchCamera();
        else startSearchCamera();
      });

      byId("lookup-form").addEventListener("submit", (e) => {
        e.preventDefault();
        lookupProduct(byId("lookup-barcode").value);
      });

      // --- قائمة المخزون ---
      function renderInventory(query = "") {
        const q = query.trim().toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.barcode.toLowerCase().includes(q));
        byId("inventory-count").textContent = numberFormat.format(products.length);

        const list = byId("inventory-list");
        if (!filtered.length) {
          list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted); font-size:13px;">لا توجد مواد مسجلة.</div>`;
          return;
        }

        list.innerHTML = filtered.map(p => `
          <div class="inventory-row">
            <div class="item-info">
              <strong>${escapeHtml(p.name)}</strong>
              <span>${escapeHtml(p.barcode)}</span>
            </div>
            <div class="item-qty">
              <strong>${numberFormat.format(p.stock)} مخزن</strong>
              <span>عرض: ${numberFormat.format(p.display)}</span>
            </div>
            <button class="delete-btn" type="button" data-del="${escapeHtml(p.barcode)}" title="حذف">×</button>
          </div>
        `).join("");
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      byId("inventory-search").addEventListener("input", (e) => {
        renderInventory(e.target.value);
      });

      byId("inventory-list").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-del]");
        if (!btn) return;
        products = products.filter(p => p.barcode !== btn.dataset.del);
        saveProducts();
        renderInventory(byId("inventory-search").value);
      });

      renderInventory();
    })();
  </script>
</body>
</html>
